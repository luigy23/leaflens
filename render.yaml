services:
  - type: web
    name: leaflens-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://leaflens.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: leaflens-db
          property: connectionString

databases:
  - name: leaflens-db
    plan: free
    databaseName: leaflens
    user: leaflens
