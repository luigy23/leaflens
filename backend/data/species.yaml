# LeafLens species catalog — curated for all 47 classes in the dataset.
#
# IMPORTANT: `common_name` matches the exact folder name from the Kaggle
# House Plant Species dataset. This is what the model returns, so the
# backend can look up care information directly.
#
# Sources: ASPCA toxicity database, RHS plant finder, Pl@ntNet,
# Missouri Botanical Garden, standard horticultural references.

- scientific_name: Saintpaulia ionantha
  common_name: African Violet (Saintpaulia ionantha)
  family: Gesneriaceae
  origin: Tanzania and Kenya
  description: >
    Compact rosette-forming plant with velvety leaves and small clustered
    flowers in violet, pink, or white. Famously fussy about watering technique.
  care:
    watering_days_min: 7
    watering_days_max: 10
    light_level: bright-indirect
    temperature_min_c: 18
    temperature_max_c: 24
    humidity_pct: "40-60"
    fertilizer_schedule: every 2 weeks with balanced houseplant fertilizer
  toxicity:
    - animal: cat
      level: safe
    - animal: dog
      level: safe

- scientific_name: Aloe vera
  common_name: Aloe Vera
  family: Asphodelaceae
