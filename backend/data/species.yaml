- scientific_name: Aloe vera
  common_name: Aloe Vera
  family: Asphodelaceae
  origin: Arabian Peninsula
  description: 'Succulent species widely grown for its medicinal leaves. Stores water
    in thick, fleshy leaves that allow it to survive long dry periods.

    '
  care:
    watering_days_min: 14
    watering_days_max: 21
    light_level: bright-indirect
    temperature_min_c: 13
    temperature_max_c: 27
    humidity_pct: 30-50
    fertilizer_schedule: every 2 months in spring and summer
  toxicity:
  - animal: cat
    level: toxic
    notes: saponins cause vomiting and diarrhea
  - animal: dog
    level: toxic
    notes: saponins cause vomiting and diarrhea
